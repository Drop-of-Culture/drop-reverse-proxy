services:
  # 1. Le Routeur Principal
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json # Stockage SSL Let's Encrypt
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Configuration TLS automatique à décommenter si besoin :
      # - "--certificatescentral.acme.httpchallenge=true"
      # - "--certificatescentral.acme.httpchallenge.entrypoint=web"
    deploy:
      resources:
        limits:
          memory: 80M # Traefik est ultra-léger en Go

  # 2. Le Gardien Authentification
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.4.0
    container_name: oauth2-proxy
    restart: unless-stopped
    environment:
      - OAUTH2_PROXY_PROVIDER=github # Exemple : github, google, keycloak, etc.
      - OAUTH2_PROXY_CLIENT_ID=votre_client_id
      - OAUTH2_PROXY_CLIENT_SECRET=votre_client_secret
      - OAUTH2_PROXY_COOKIE_SECRET=un_secret_de_32_octets_minimum_base64
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_UPSTREAMS=static://202 # Réponse vide par défaut si OK
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
    labels:
      - "traefik.enable=true"
      # Configuration du Middleware de vérification
      - "traefik.http.middlewares.auth-verify.forwardauth.address=http://oauth2-proxy:4180/oauth2/auth"
      - "traefik.http.middlewares.auth-verify.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.auth-verify.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email"
      # Router public nécessaire pour intercepter les callbacks d'auth (/oauth2/callback)
      - "traefik.http.routers.oauth.rule=Host(`://votre-domaine.com`) && PathPrefix(`/oauth2`)"
      - "traefik.http.routers.oauth.entrypoints=websecure"
      - "traefik.http.routers.oauth.service=oauth2-proxy"
    deploy:
      resources:
        limits:
          memory: 50M

  # 3. Base de données PostgreSQL bridée
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: mon_projet
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      # Optimisations RAM critiques pour un VPS de 2 Go
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=20
    deploy:
      resources:
        limits:
          memory: 250M

  # 4. Votre API Admin Rust
  api-admin-rust:
    image: votre-api-rust:latest # Image construite à partir de votre binaire Rust
    container_name: api-admin-rust
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-admin.rule=Host(`://votre-domaine.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.api-admin.entrypoints=websecure"
      # Activation de la protection Oauth2 sur cette route !
      - "traefik.http.routers.api-admin.middlewares=auth-verify"
    deploy:
      resources:
        limits:
          memory: 60M # Rust n'a besoin de rien, 60M est déjà énorme

  # 5. Interface d'administration Postgres
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@votre-domaine.com
      PGADMIN_DEFAULT_PASSWORD: password_pgadmin
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pg://votre-domaine.com`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      # Protection par OAuth2 également
      - "traefik.http.routers.pgadmin.middlewares=auth-verify"
    deploy:
      resources:
        limits:
          memory: 300M # Contrainte forte sur pgAdmin (Python) pour éviter qu'il dérive

  # 6. Votre Reverse Proxy Maison en Rust (Optionnel si mis dans Docker)
  proxy-maison:
    image: votre-proxy-maison-rust:latest
    container_name: proxy-maison
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Route publique classique sans aucun middleware d'authentification
      - "traefik.http.routers.proxy-maison.rule=Host(`votre-domaine-public.com`)"
      - "traefik.http.routers.proxy-maison.entrypoints=websecure"
    deploy:
      resources:
        limits:
          memory: 60M

volumes:
  pgdata: