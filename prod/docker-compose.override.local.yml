# Local test overrides for prod/docker-compose.yml: plain http, no Let's Encrypt.
#
# Usage (from repo root, images built first, prod/app.toml and prod/.env filled):
#   docker compose -f prod/docker-compose.yml -f prod/docker-compose.override.local.yml -p prod-test up
#
# With DOMAIN=localhost in prod/.env:
#   http://localhost:8000                  -> proxy
#   http://admin.localhost:8000            -> oauth2-proxy -> admin
#   http://admin.localhost:8000/pgadmin/   -> oauth2-proxy -> pgadmin
#   http://localhost:8082                  -> Traefik dashboard
# The GitHub OAuth App callback must then be http://admin.localhost:8000/oauth2/callback
# and app.toml allowed_origin 'http://admin.localhost:8000'.

services:
  traefik:
    container_name: prod-test-traefik
    # host nginx already listens on 80
    ports: !override
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8082:8080"
    command: !override
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
      - "--log.level=INFO"

  oauth2-proxy:
    container_name: prod-test-oauth2-proxy
    environment:
      - OAUTH2_PROXY_REDIRECT_URL=http://admin.${DOMAIN}:8000/oauth2/callback
      - OAUTH2_PROXY_COOKIE_SECURE=false
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.admin.entrypoints=web"
      - "traefik.http.services.admin.loadbalancer.server.port=4180"

  postgres:
    container_name: prod-test-postgres

  api-admin-rust:
    container_name: prod-test-api-admin-rust

  pgadmin:
    container_name: prod-test-pgadmin

  proxy-maison:
    container_name: prod-test-proxy-maison
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.proxy-maison.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.proxy-maison.entrypoints=web"
      - "traefik.http.services.proxy-maison.loadbalancer.server.port=8000"

  apache:
    container_name: prod-test-apache
