# Local test overrides for prod/docker-compose.yml
#
# Usage (from repo root):
#   touch prod/acme.json && chmod 600 prod/acme.json
#   docker compose -f prod/docker-compose.yml -f prod/docker-compose.override.local.yml -p prod-test up
#
# Then:
#   http://pgadmin.localhost:8000   -> pgAdmin (no OAuth)
#   http://localhost:8081           -> Traefik dashboard
#
# The Rust images and oauth2-proxy are behind profiles because they can't run locally yet
# (no Dockerfile / no real OAuth app). Enable them with e.g. `--profile rust` once ready.

services:
  traefik:
    container_name: prod-test-traefik
    # host nginx already listens on 80
    ports: !override
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8081:8080"
    command: !override
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=prod-test_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--api.insecure=true"
      - "--log.level=INFO"

  oauth2-proxy:
    container_name: prod-test-oauth2-proxy
    profiles: ["oauth"]

  postgres:
    container_name: prod-test-postgres

  pgadmin:
    container_name: prod-test-pgadmin
    labels: !override
      - "traefik.enable=true"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.localhost`)"
      - "traefik.http.routers.pgadmin.entrypoints=web"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"

  api-admin-rust:
    container_name: prod-test-api-admin-rust
    profiles: ["rust"]

  proxy-maison:
    container_name: prod-test-proxy-maison
    profiles: ["rust"]
