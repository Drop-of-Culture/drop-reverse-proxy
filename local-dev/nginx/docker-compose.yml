# oauth2-proxy behind the local nginx (see install.sh).
# Stop the one in ../oauth2-proxy first: both listen on 127.0.0.1:4180.
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: oauth2-proxy-nginx
    restart: unless-stopped
    network_mode: host
    command: --config=/etc/oauth2-proxy/oauth2-proxy.cfg
    env_file: ../oauth2-proxy/.env
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
