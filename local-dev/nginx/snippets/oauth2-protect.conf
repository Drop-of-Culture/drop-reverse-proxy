# Include inside each protected `location /`
auth_request /oauth2/auth;
error_page 401 = @oauth2_signin;

# Login comes from oauth2-proxy and REPLACES anything the client sent.
# The admin app trusts X-Forwarded-User, so this override matters.
auth_request_set $auth_user  $upstream_http_x_auth_request_user;
auth_request_set $auth_email $upstream_http_x_auth_request_email;
proxy_set_header X-Forwarded-User  $auth_user;
proxy_set_header X-Forwarded-Email $auth_email;

# Passes on cookie refreshes from oauth2-proxy
auth_request_set $auth_cookie $upstream_http_set_cookie;
add_header Set-Cookie $auth_cookie;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
