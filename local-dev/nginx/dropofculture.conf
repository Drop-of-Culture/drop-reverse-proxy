# Local copy of the production site, with *.dropofculture.test names
# and a self-signed certificate (see install.sh).

# Port 80: redirect everything to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dropofculture.test admin.dropofculture.test pgadmin.dropofculture.test;

    location / { return 301 https://$host$request_uri; }
}

# Public app -> localhost:8000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dropofculture.test;

    ssl_certificate     /etc/nginx/ssl/dropofculture.test.crt;
    ssl_certificate_key /etc/nginx/ssl/dropofculture.test.key;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# Admin binary (127.0.0.1:8081), behind oauth2-proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.dropofculture.test;

    ssl_certificate     /etc/nginx/ssl/dropofculture.test.crt;
    ssl_certificate_key /etc/nginx/ssl/dropofculture.test.key;

    include snippets/oauth2-proxy.conf;

    location / {
        include snippets/oauth2-protect.conf;
        proxy_pass http://127.0.0.1:8081;
    }
}

# pgAdmin (127.0.0.1:5050), behind oauth2-proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pgadmin.dropofculture.test;

    ssl_certificate     /etc/nginx/ssl/dropofculture.test.crt;
    ssl_certificate_key /etc/nginx/ssl/dropofculture.test.key;

    include snippets/oauth2-proxy.conf;

    location / {
        include snippets/oauth2-protect.conf;
        proxy_set_header X-Scheme $scheme;   # pgAdmin uses this for redirects
        proxy_pass http://127.0.0.1:5050;
    }
}
