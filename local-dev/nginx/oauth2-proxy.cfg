# oauth2-proxy in auth_request mode: nginx asks it "is this user logged in?"
# and does the proxying itself. Secrets come from ../oauth2-proxy/.env.
provider = "github"
scope = "user:email read:org"
email_domains = ["*"]

http_address = "127.0.0.1:4180"
reverse_proxy = true
upstreams = ["static://202"]
# sends X-Auth-Request-User (GitHub login) and X-Auth-Request-Email to nginx
set_xauthrequest = true
skip_provider_button = true

# one GitHub callback, one cookie shared by admin. and pgadmin.
redirect_url = "https://admin.dropofculture.test/oauth2/callback"
cookie_domains = [".dropofculture.test"]
whitelist_domains = [".dropofculture.test"]

cookie_name = "_admin_oauth2"
cookie_samesite = "lax"
cookie_expire = "12h"
cookie_secure = true
