# Secrets and the GitHub org/team come from .env (OAUTH2_PROXY_* variables).
provider = "github"
scope = "user:email read:org"
# the GitHub org/team membership does the filtering
email_domains = ["*"]

http_address = "127.0.0.1:4180"
upstreams = ["http://127.0.0.1:8081/"]
redirect_url = "http://localhost:4180/oauth2/callback"
skip_provider_button = true

# sends X-Forwarded-User (GitHub login) and X-Forwarded-Email to the admin app
pass_user_headers = true

cookie_name = "_admin_oauth2"
cookie_samesite = "lax"
cookie_expire = "12h"
# local dev is plain http; must be true in production (https)
cookie_secure = false
