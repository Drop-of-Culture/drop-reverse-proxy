# Drop files (playlists, segments), fetched server-side by the proxy only.
# From ../apache-conf/conf/httpd-vhosts.conf, logs sent to stdout/stderr for docker logs.
<VirtualHost *:80>
    DocumentRoot "/usr/local/apache2/htdocs/"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
    <Directory /usr/local/apache2/htdocs/>
        Require all granted
        Options +Indexes
        AllowOverride None
    </Directory>
</VirtualHost>
