[package]
name = "drop-reverse-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8" }
tokio = { version = "1.53", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"
serde_json = "1.0"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1.25", features = ["v4"] }
redis = { version = "1.6" }
derive-new = "0.7"
reqwest = { version = "0.13", features = ["json"] }
figment = { version = "0.10", features = ["toml"] }
flate2 = "1.1.5"
tar = "0.4.44"
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres" ] }
tracing = "0.1"
async-trait = "0.1"
tempfile = "3.25"
toml = "1.1"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
